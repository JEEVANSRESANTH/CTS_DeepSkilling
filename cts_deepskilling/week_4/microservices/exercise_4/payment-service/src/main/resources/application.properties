server.port=8083
spring.application.name=payment-service

# Resilience4j Circuit Breaker config
resilience4j.circuitbreaker.instances.thirdPartyPayment.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.thirdPartyPayment.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.thirdPartyPayment.sliding-window-size=10
resilience4j.circuitbreaker.instances.thirdPartyPayment.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.thirdPartyPayment.permitted-number-of-calls-in-half-open-state=3

# Actuator - expose circuit breaker health
management.endpoints.web.exposure.include=health,circuitbreakers
management.endpoint.health.show-details=always
