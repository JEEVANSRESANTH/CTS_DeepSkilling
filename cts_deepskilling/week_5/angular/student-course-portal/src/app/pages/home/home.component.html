<div class="container">
  <h1>{{ portalName }}</h1>
  <p>Welcome to the Student Course Portal. Browse and enroll in available courses.</p>

  <div style="display:flex; gap:2rem; margin:1.5rem 0">
    <div class="card" style="text-align:center; min-width:140px">
      <div style="font-size:2rem; font-weight:700; color:#1976d2">{{ coursesCount }}</div>
      <div>Courses Available</div>
    </div>
    <div class="card" style="text-align:center; min-width:140px">
      <div style="font-size:2rem; font-weight:700; color:#388e3c">3</div>
      <div>Enrolled</div>
    </div>
    <div class="card" style="text-align:center; min-width:140px">
      <div style="font-size:2rem; font-weight:700; color:#f57c00">3.8</div>
      <div>GPA</div>
    </div>
  </div>

  <button class="btn-primary" [disabled]="!isPortalActive" (click)="onEnrollClick()">Enroll Now</button>
  <p *ngIf="message" style="margin-top:0.5rem; color:green">{{ message }}</p>

  <div style="margin-top:1.5rem">
    <input type="text" [(ngModel)]="searchTerm" placeholder="Search courses..."
           style="padding:0.5rem; width:300px; border:1px solid #ccc; border-radius:4px">
    <p style="margin-top:0.5rem; color:#666">Searching for: {{ searchTerm }}</p>
  </div>
</div>
