<div [ngClass]="cardClasses"
     appHighlight="lightyellow"
     [ngStyle]="{ 'border-left': '4px solid ' +
       (course.gradeStatus === 'passed' ? '#388e3c' :
        course.gradeStatus === 'failed' ? '#d32f2f' : '#9e9e9e') }">

  <h3>{{ course.name }}</h3>
  <p style="color:#666; font-size:0.9rem">{{ course.code }}</p>

  <div [ngSwitch]="course.gradeStatus" style="margin:0.5rem 0">
    <span *ngSwitchCase="'passed'" class="badge badge-passed">✓ Passed</span>
    <span *ngSwitchCase="'failed'" class="badge badge-failed">✗ Failed</span>
    <span *ngSwitchCase="'pending'" class="badge badge-pending">⏳ Pending</span>
  </div>

  <p style="font-size:0.85rem; color:#555">{{ course.credits | creditLabel }}</p>

  <div style="display:flex; gap:0.5rem; margin-top:0.75rem">
    <button class="btn-primary" (click)="onEnrollClick()">
      {{ enrollmentService.isEnrolled(course.id) ? 'Unenroll' : 'Enroll' }}
    </button>

    <button (click)="isExpanded = !isExpanded" style="background:#eee">
      {{ isExpanded ? 'Hide Details' : 'Show Details' }}
    </button>
  </div>

  <div *ngIf="isExpanded" style="margin-top:1rem; padding-top:1rem; border-top:1px solid #eee">
    <p><strong>Course ID:</strong> {{ course.id }}</p>
    <p><strong>Credits:</strong> {{ course.credits }}</p>
    <p><strong>Status:</strong> {{ course.gradeStatus }}</p>
  </div>
</div>
